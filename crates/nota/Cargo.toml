[package]
name = "nota"
description = "Record, transcribe and summarise lectures, locally."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `nota record --tone yes`: a synthetic tone in place of the audio server,
# for the end-to-end tests. Turned on by the self dev-dependency below, so
# any build that also builds nota's tests has it; `cargo build -p nota`
# (the release build) doesn't.
fake-capture = []
# `nota record --latency-log FILE`: logs when each text reached the screen,
# for `scripts/live-latency.sh`. Turned on for nota's tests as above, and
# off in the release build.
latency-log = []

[[test]]
name = "record"
required-features = ["fake-capture"]

[dependencies]
directories.workspace = true
# Home's dates in the local time zone (the TZ variable, /etc/localtime and
# the system's zoneinfo), without unsafe code or a C library.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
nota-core = { path = "../nota-core" }
nota-engine = { path = "../nota-engine" }
nota-recorder = { path = "../nota-recorder" }
nota-store = { path = "../nota-store" }
nota-tui = { path = "../nota-tui" }
ratatui.workspace = true

# SIGHUP, SIGTERM and SIGINT, read on a thread so the recording can stop
# in order. Already in the tree through crossterm.
[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[dev-dependencies]
nota = { path = ".", features = ["fake-capture", "latency-log"] }
nota-core = { path = "../nota-core", features = ["fake-clock"] }
nota-recorder = { path = "../nota-recorder", features = ["fake-fs"] }
# To make an M1 per-session store in the migration test.
rusqlite.workspace = true

# A pseudo-terminal for the end-to-end test, and signals to send.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["pty", "termios", "process", "fs", "event"] }

[lints]
workspace = true
