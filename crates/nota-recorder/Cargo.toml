[package]
name = "nota-recorder"
description = "nota's recorder: the filesystem layer every durable write goes through, audio capture, the crash-safe PCM journal, FLAC segments and salvage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `FakeFs` and the crash test helper, for other crates' tests. Enable it from
# `[dev-dependencies]` only.
fake-fs = []
# Builds the `nota-fake-engine` test double. The recorder's own tests turn
# it on (see `[dev-dependencies]`); nothing else should.
fake-engine = []

[[bin]]
name = "nota-fake-engine"
required-features = ["fake-engine"]

[[test]]
name = "supervisor"
required-features = ["fake-engine"]

[[test]]
name = "hangup"
required-features = ["fake-engine"]

[dependencies]
crc32fast.workspace = true
flacenc.workspace = true
nota-core = { path = "../nota-core" }
nota-store = { path = "../nota-store" }
sha2.workspace = true

# cpal's PipeWire host; it links libpipewire-0.3, libasound and, for rtkit
# (`realtime-dbus`), libdbus-1 (see the `capture` module's docs for the
# build dependencies). thread-priority promotes the stream's thread to
# real time directly, where the user's rtprio limit allows it.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pipewire", "realtime-dbus"] }
thread-priority.workspace = true

[dev-dependencies]
claxon.workspace = true
# Turns on `fake-engine` for test builds only, so the supervisor's tests
# always have the test double and release builds never do.
nota-recorder = { path = ".", features = ["fake-engine"] }
nota-core = { path = "../nota-core", features = ["fake-clock"] }
proptest.workspace = true

# The hangup test: a recorder in a process group of its own that catches
# SIGHUP as `nota record` does, and signals to send it.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }
signal-hook.workspace = true

[lints]
workspace = true
