[package]
name = "nota-recorder"
description = "nota's recorder: the filesystem layer every durable write goes through, audio capture, the crash-safe PCM journal, FLAC segments and salvage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `FakeFs` and the crash test helper, for other crates' tests. Enable it from
# `[dev-dependencies]` only.
fake-fs = []

[dependencies]
crc32fast.workspace = true
flacenc.workspace = true
nota-core = { path = "../nota-core" }
nota-store = { path = "../nota-store" }
sha2.workspace = true

# cpal's PipeWire host; it links libpipewire-0.3 and libasound (see the
# `capture` module's docs for the build dependencies).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pipewire"] }

[dev-dependencies]
claxon.workspace = true
nota-core = { path = "../nota-core", features = ["fake-clock"] }
proptest.workspace = true

[lints]
workspace = true
