[package]
name = "nota-engine"
description = "nota's speech engine child (`nota engine asr`): voice activity detection, pause-cut chunks and Parakeet, on sherpa-onnx."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nota-core = { path = "../nota-core" }
# Pinned exactly: its build script downloads the matching prebuilt static
# sherpa-onnx and onnxruntime archive, so a version bump changes native code.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["static"] }

# Setting stdout aside for the protocol (`run_asr`).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["stdio"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
