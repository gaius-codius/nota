# cargo-mutants (the PR job in ci.yml, the weekly run in mutants.yml).

# Test doubles and test harnesses aren't mutated: they exist only for the
# tests, which check the recorder against them, so a mutant in them shows
# what the double happens not to need, not a gap in what nota does. They
# build only for tests or behind the test-only features (fake-fs,
# fake-engine, fake-clock), which nothing enables outside dev-dependencies:
# the fake filesystem and its crash and sweep harnesses (fs/fake.rs,
# fs/crash.rs, fs/sweep.rs), the fake speech engine (bin/nota-fake-engine.rs),
# and the inline `fake` modules below in exclude_re (FakeClock in
# nota-core's clock.rs, FakeStore in segment/store.rs).
exclude_globs = [
  "crates/nota-recorder/src/fs/fake.rs",
  "crates/nota-recorder/src/fs/crash.rs",
  "crates/nota-recorder/src/fs/sweep.rs",
  "crates/nota-recorder/src/bin/nota-fake-engine.rs",
]

# The PipeWire stream's Debug impl only names the type, and a test would need
# a running PipeWire to make one.
#
# Whether the kernel grants real-time priority depends on the machine's
# rtprio limit. CI's runners have none, so a promotion that always reports
# failure can't be told apart there, and this file applies to every run.
# The test asserts the promotion wherever the limit allows SCHED_FIFO, so
# running it on such a machine (the development machine) checks it.
#
# How long the machine has been suspended is read from the kernel's two
# monotonic clocks, and only a real suspend moves it: on an awake machine,
# a CI runner's included, a reading of zero can't be told from the real
# one. The capture tests drive suspends through the fake clock instead.
#
# The watch on PipeWire's graph (capture/pipewire/watch.rs) runs only against
# a live PipeWire, which CI's runners don't have: its loop, its subscriptions
# and its Drop are run by scripts/pipewire-devices.sh, on a private instance.
# What it decides is in capture/route.rs, and what it reads (audio_node,
# default_event, Pending) has unit tests; those stay mutated.
#
# The Pulse and ALSA hosts (capture/pulse.rs, alsa.rs, cpal_input.rs) and
# the Pulse probe need a live audio server that CI's runners don't have, so
# these functions are never run there: the two backends' `host` (the
# connection), `pulse_reachable` (whether the server answers) and
# PlainStream's Debug impl. Nothing runs them until the real PulseAudio run
# on M7's VM (GAI-207). What they decide, from the device split and names to
# the host choice, is in functions with unit tests; those stay mutated.
exclude_re = [
  # The inline test doubles; see exclude_globs above.
  "(nota-core/src/clock|nota-recorder/src/segment/store)\\.rs:.* fake::",
  "pipewire/watch\\.rs:.*(impl std::fmt::Debug for Watch>|impl Drop for Watch>|replace watch -> | run -> | in run$|Watcher::|Subscription::)",
  "impl .*Debug for PipeWireStream",
  "alsa\\.rs:.*replace host -> ",
  "pulse\\.rs:.*replace host -> ",
  "replace <impl HostProbe for SystemProbe>::pulse_reachable -> bool",
  "impl .*Debug for PlainStream",
  "replace promote_current_thread -> bool with false",
  "replace <impl Clock for SystemClock>::suspended -> Duration with Default::default\\(\\)",
  "replace asleep_now -> Duration with Default::default\\(\\)",
]
