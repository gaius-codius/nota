# The sherpa-onnx static archive for Windows is built against the static C
# runtime (/MT). Linking it into a binary that uses the dynamic runtime (the
# Rust default) mixes the two (LNK4098), so Windows builds use the static
# runtime too.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# sherpa-onnx's libraries come from the archive scripts/sherpa-onnx.sh pins
# by SHA-256 and unpacks here, never from the sys crate's own unchecked
# download. Run the script once per clone (and after `cargo clean`); until
# then, builds that link sherpa-onnx fail with "SHERPA_ONNX_LIB_DIR does not
# exist". An SHERPA_ONNX_LIB_DIR set in the environment wins. Cargo reads
# this file only when it runs inside the repo; nota-engine's build script
# stops a build from elsewhere, where the variable is unset. The directory's
# name carries a hash of the pins, so a new pin changes the variable and
# cargo rebuilds sherpa-onnx-sys in every target directory; the script
# fails until this line names its directory.
[env]
SHERPA_ONNX_LIB_DIR = { value = "target/sherpa-onnx/sherpa-onnx-lib-31666b6e566ce903", relative = true }
