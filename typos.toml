[files]
extend-exclude = [
  "nota-logo/",
  "*.svg",
  "*.png",
  "Cargo.lock",
  "LICENSE-*",
  # Fetched lists of names, spelled as their sources spell them.
  "packs/pharmacy/rxnorm.tsv",
  "packs/pharmacy/wikidata.tsv",
  # Mis-heard terms from the research bench ("anormal", "ACI"), which C1 and
  # C2 are tested on; the files are generated (the bench's
  # fixtures/export.py).
  "crates/nota-checks/tests/fixtures/c1_pairs.json",
  "crates/nota-checks/tests/fixtures/c2_gate.json",
  # Words from wordfreq's list ("thar") and invented mis-hearings, which C4
  # is tested on; the file is generated (the bench's fixtures/c4_invented.py).
  "crates/nota-checks/tests/fixtures/c4_invented.json",
]

# Real words typos doesn't know. Add specialist terms here when a test fixture
# needs them, with a comment saying why.
[default.extend-words]
caf = "caf"  # Core Audio Format, in scripts/check-files.sh
# Crate names, in clippy.toml and clippy-crates.txt.
flate = "flate"
ratatui = "ratatui"
writeable = "writeable"
