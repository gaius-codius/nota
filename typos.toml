[files]
extend-exclude = [
  "nota-logo/",
  "*.svg",
  "*.png",
  "Cargo.lock",
  "LICENSE-*",
  # Mis-heard terms from the research bench ("anormal", "ACI"), which C1 is
  # tested on; the file is generated (the bench's fixtures/export.py).
  "crates/nota-checks/tests/fixtures/c1_pairs.json",
]

# Real words typos doesn't know. Add specialist terms here when a test fixture
# needs them, with a comment saying why.
[default.extend-words]
caf = "caf"  # Core Audio Format, in scripts/check-files.sh
# Crate names, in clippy.toml and clippy-crates.txt.
flate = "flate"
ratatui = "ratatui"
writeable = "writeable"
