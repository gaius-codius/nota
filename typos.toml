[files]
extend-exclude = [
  "nota-logo/",
  "*.svg",
  "*.png",
  "Cargo.lock",
  "LICENSE-*",
]

# Real words typos doesn't know. Add specialist terms here when a test fixture
# needs them, with a comment saying why.
[default.extend-words]
caf = "caf"  # Core Audio Format, in scripts/check-files.sh
# Crate names, in clippy.toml and clippy-crates.txt.
flate = "flate"
ratatui = "ratatui"
writeable = "writeable"
# Names in the pharmacy pack's source lists (packs/pharmacy/), spelled as
# their sources spell them: a chelator (DOTA), a bacterium (B. infantis), a
# dye (brillant blue) and a citral isomer (neral).
dota = "dota"
infantis = "infantis"
brillant = "brillant"
neral = "neral"
