# cargo-deny: licences, advisories, bans and sources. Runs in CI and the pre-push hook.
# Schema as of cargo-deny 0.20.

[graph]
all-features = true

[advisories]
# Vulnerabilities and yanked crates fail; unmaintained crates fail only if
# they're direct dependencies of a workspace crate.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. GPL, LGPL and AGPL code is never linked into a
# distributed binary (if nota uses espeak-ng, it runs as a separate program).
# This sees crates only, not native archives: sherpa-onnx's default archive
# links GPL text-to-speech libraries, so a build for distribution must use
# scripts/sherpa-onnx.sh --no-tts and pass scripts/check-no-gpl.sh (CI's
# no-gpl job does both).
#
# MPL-2.0 is file-level copyleft. It isn't allowed in general: each MPL crate
# is reviewed and listed under [[licenses.exceptions]] below.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory: unused entries are fine.
unused-allowed-license = "allow"
# Build scripts, proc macros and dev-dependencies count too: they run on
# contributors' machines.
include-build = true
include-dev = true

# option-ext (through `directories`, in the release binary), accepted
# 2026-10-09: two small files, used unmodified, and MPL-2.0 puts no terms on
# nota's own files. A release must tell its recipients where option-ext's
# source is (MPL-2.0 3.2(a)), for example in a third-party notices file.
# Replacing `directories` with a hand-written XDG lookup would drop it, but
# would mean writing the macOS and Windows lookups again for v2 and v3.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

# audio_thread_priority (through cpal's real-time promotion, in the release
# binary): in the tree since M1b, when MPL-2.0 was allowed for every crate,
# and listed here when that ended (2026-10-09). Used unmodified; the same
# notice as option-ext applies to a release.
[[licenses.exceptions]]
crate = "audio_thread_priority"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Native model code (sherpa-onnx, onnxruntime) stays in the engine child.
  { crate = "sherpa-onnx", wrappers = ["nota-engine"] },
  # Audio capture (cpal, with its PipeWire and ALSA bindings) stays in the
  # recorder.
  { crate = "cpal", wrappers = ["nota-recorder"] },
  # The native crates under those two may only be reached through them, so
  # no other crate can link sherpa-onnx, PipeWire or ALSA by depending on
  # them directly.
  { crate = "sherpa-onnx-sys", wrappers = ["sherpa-onnx"] },
  # The recorder also watches PipeWire's graph itself, for device events.
  { crate = "pipewire", wrappers = ["cpal", "nota-recorder"] },
  { crate = "pipewire-sys", wrappers = ["pipewire"] },
  { crate = "libspa", wrappers = ["pipewire"] },
  { crate = "libspa-sys", wrappers = ["libspa", "pipewire", "pipewire-sys"] },
  { crate = "alsa", wrappers = ["cpal"] },
  # cpal's `realtime` feature (rtkit, through `realtime-dbus`) depends on
  # alsa-sys directly.
  { crate = "alsa-sys", wrappers = ["alsa", "cpal"] },
  # rtkit over D-Bus (cpal's `realtime-dbus`): libdbus through cpal's
  # real-time promotion, and through nota's logind sleep inhibitor.
  { crate = "audio_thread_priority", wrappers = ["cpal"] },
  { crate = "dbus", wrappers = ["audio_thread_priority", "nota"] },
  { crate = "libdbus-sys", wrappers = ["dbus"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
