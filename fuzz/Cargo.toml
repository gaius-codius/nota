[package]
name = "nota-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: the fuzz targets are built with cargo-afl and are not
# part of the normal build or test runs. CI builds them and lints them (the
# "Fuzz targets build" job), and the pre-push hook lints them; neither
# fuzzes.
[workspace]

[dependencies]
afl = "0.18"
crc32fast = "1.5"
nota-core = { path = "../crates/nota-core" }
nota-recorder = { path = "../crates/nota-recorder" }

# The root workspace's lints, copied: this is a workspace of its own, so it
# can't inherit them. Keep this table the same as [workspace.lints] in the
# root Cargo.toml.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# Adopted from conspector's lint trial (GAI-232). `trivial_casts` was dropped
# there and is not adopted here.
unused_qualifications = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Restriction lints picked one by one. `unwrap_used` and `expect_used` are allowed
# in tests through clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# The TUI owns the terminal; stray prints corrupt the screen. CLI output uses
# writeln! on an explicit handle.
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
# Lint exceptions are #[expect(...)], so one that no longer fires is reported.
allow_attributes = "warn"
str_to_string = "warn"
clone_on_ref_ptr = "warn"
# Modules are `foo.rs` with a `foo/` folder; no `mod.rs` files.
mod_module_files = "warn"
# From `nursery`, which can change between toolchains; check these when the
# toolchain is bumped. `redundant_clone` catches a clone of a value that is not
# used again. `use_self` asks for `Self` inside an impl, instead of repeating
# the type's name. A false positive gets #[expect(clippy::..., reason = "...")];
# if those pile up, drop the lint.
redundant_clone = "warn"
use_self = "warn"
