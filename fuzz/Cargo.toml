[package]
name = "nota-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: the fuzz targets are built with cargo-afl and are not
# part of the normal build, test or CI runs.
[workspace]

[dependencies]
afl = "0.18"
crc32fast = "1.5"
nota-core = { path = "../crates/nota-core" }
nota-recorder = { path = "../crates/nota-recorder" }
