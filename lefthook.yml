# Git hooks for nota. Install once per clone: `lefthook install`.
# CI runs the same checks, so skipping a hook only delays the failure, and
# skipping one on purpose (--no-verify) is against the "Code quality" rules in AGENTS.md.
# Needs on PATH: cargo, cargo-deny, cargo-shear, typos, gitleaks, jq; uvx and
# actionlint for workflow edits.
# A lefthook-local.yml next to this file, if present, adds hooks for one machine.
#
# The hooks every gaius-codius Rust project runs the same way (fmt, typos,
# workflows; deny, shear) come from rust-ci's lefthook/rust.yml. Its `ref`
# moves with the rust-ci pin in .github/workflows/ci.yml; run `lefthook
# install` again after it changes, and check `lefthook dump` lists them.
# A remote command overrides one of the same name here.
remotes:
  - git_url: https://github.com/gaius-codius/rust-ci
    ref: v1.0.0
    configs:
      - lefthook/rust.yml

pre-commit:
  parallel: true
  commands:
    files:
      run: scripts/check-files.sh --staged
    clippy-bans:
      # Every crate in the lock files is classified in clippy-crates.txt.
      run: scripts/check-clippy-bans.sh
    secrets:
      run: gitleaks git --pre-commit --staged --no-banner --redact .

pre-push:
  parallel: true
  commands:
    clippy:
      run: cargo clippy --workspace --all-targets --locked --config 'build.warnings="deny"'
    clippy-fuzz:
      # fuzz/ is a workspace of its own, so the clippy above doesn't reach it.
      run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked --config 'build.warnings="deny"'
    doc:
      run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items --workspace --all-features --locked
    test:
      # --all-targets: examples' unit tests too, run by the test harness, so
      # no example's main runs.
      run: cargo nextest run --workspace --all-targets --locked --no-tests=fail
    test-targets:
      # Every workspace target is in the test above; the arguments must match.
      run: scripts/check-test-targets.sh
    script-tests:
      # check-clippy-bans.sh's and check-test-targets.sh's tests, and the crash
      # runner's against stand-ins (no FUSE or LazyFS; the real sweep stays a manual gate). CI
      # runs these and the other scripts' tests in its Script tests job.
      run: scripts/check-clippy-bans.test.sh && scripts/check-test-targets.test.sh && scripts/lazyfs-crash.test.sh
    doctest:
      run: cargo test --workspace --locked --doc
    weakened:
      # Report only; CI requires an explanation in the PR body.
      run: |
        wc=${XDG_CACHE_HOME:-$HOME/.cache}/weakened-checks/v1.0.0
        [ -x "$wc/check-weakened.sh" ] ||
          git clone -q --depth 1 -b v1.0.0 https://github.com/gaius-codius/weakened-checks "$wc"
        if git rev-parse -q --verify origin/main >/dev/null; then "$wc/check-weakened.sh" origin/main HEAD || true; fi
