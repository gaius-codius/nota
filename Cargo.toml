[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Audio capture: the PipeWire host on Linux. Only nota-recorder may use it
# (deny.toml).
cpal = { version = "0.18", default-features = false }
# Decodes FLAC segments in tests, to check what was encoded.
claxon = "0.4"
# The journal's per-frame checksum (CRC-32, IEEE).
crc32fast = { version = "1.5", default-features = false, features = ["std"] }
# FLAC segments: a pure-Rust encoder, without its logging, threading and serde.
flacenc = { version = "0.5", default-features = false }
# Golden tests for screens: Ratatui's TestBackend output, compared as text.
insta = { version = "1.49", default-features = false }
proptest = { version = "1.11", default-features = false, features = ["std"] }
rustix = { version = "1.1", default-features = false, features = ["std", "time"] }
# The terminal UI, on crossterm (re-exported as `ratatui::crossterm`), without
# its optional extras (the calendar widget, macros, the layout cache).
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
# The store's database, with SQLite built in (no system library).
rusqlite = { version = "0.40", features = ["bundled"] }
# Each segment's checksum in its row.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
# Real-time scheduling for the capture stream's thread, within the user's
# RLIMIT_RTPRIO (before cpal falls back to rtkit). Only nota-recorder uses it.
thread-priority = { version = "3.1", default-features = false }
# Grapheme clusters and their display width, measured the way ratatui draws
# them, for wrapping and cutting text on the screen.
unicode-segmentation = "1.12"
unicode-width = { version = "0.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Restriction lints picked one by one. `unwrap_used` and `expect_used` are allowed
# in tests through clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# The TUI owns the terminal; stray prints corrupt the screen. CLI output uses
# writeln! on an explicit handle.
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

# The crash tests encode thousands of short FLAC segments; unoptimised, the
# encoder and its hashes dominate the test run.
[profile.dev.package.flacenc]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
