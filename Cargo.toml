[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Audio capture: the PipeWire host on Linux. Only nota-recorder may use it
# (deny.toml).
cpal = { version = "0.18", default-features = false }
# Decodes FLAC segments in tests, to check what was encoded.
claxon = "0.4"
# The platform's data directory, where the library is kept. Brings in
# option-ext, which is MPL-2.0: accepted, see deny.toml.
directories = "6"
# The journal's per-frame checksum (CRC-32, IEEE).
crc32fast = { version = "1.5", default-features = false, features = ["std"] }
# FLAC segments: a pure-Rust encoder, without its logging, threading and serde.
flacenc = { version = "0.5", default-features = false }
# Golden tests for screens: Ratatui's TestBackend output, compared as text.
insta = { version = "1.49", default-features = false }
proptest = { version = "1.11", default-features = false, features = ["std"] }
rustix = { version = "1.1", default-features = false, features = ["std", "time"] }
# The terminal UI, on crossterm (re-exported as `ratatui::crossterm`), without
# its optional extras (the calendar widget, macros, the layout cache).
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
# The store's database, with SQLite built in (no system library).
rusqlite = { version = "0.40", features = ["bundled"] }
# SIGHUP, SIGTERM and SIGINT, read on a thread so a recording can stop in
# order. Already in the tree through crossterm.
signal-hook = "0.3"
# Each segment's checksum in its row.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
# Real-time scheduling for the capture stream's thread, within the user's
# RLIMIT_RTPRIO (before cpal falls back to rtkit). Only nota-recorder uses it.
thread-priority = { version = "3.1", default-features = false }
# The Omarchy theme's colours (`colors.toml`), read by the screens. Already in
# the tree as a build dependency of PipeWire's bindings.
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
# Grapheme clusters, for wrapping and cutting text on the screen (their
# widths come from ratatui, measured the way it draws them).
unicode-segmentation = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# Adopted from conspector's lint trial (GAI-232). `trivial_casts` was dropped
# there and is not adopted here.
unused_qualifications = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Restriction lints picked one by one. `unwrap_used` and `expect_used` are allowed
# in tests through clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# The TUI owns the terminal; stray prints corrupt the screen. CLI output uses
# writeln! on an explicit handle.
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
# Lint exceptions are #[expect(...)], so one that no longer fires is reported.
allow_attributes = "warn"
str_to_string = "warn"
clone_on_ref_ptr = "warn"
# Modules are `foo.rs` with a `foo/` folder; no `mod.rs` files.
mod_module_files = "warn"
# From `nursery`, which can change between toolchains; check these when the
# toolchain is bumped. `redundant_clone` catches a clone of a value that is not
# used again. `use_self` asks for `Self` inside an impl, instead of repeating
# the type's name. A false positive gets #[expect(clippy::..., reason = "...")];
# if those pile up, drop the lint.
redundant_clone = "warn"
use_self = "warn"

# The crash tests encode thousands of short FLAC segments; unoptimised, the
# encoder and its hashes dominate the test run.
[profile.dev.package.flacenc]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
