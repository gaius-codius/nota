  { path = "std::fs::create_dir", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason" },
  { path = "std::fs::create_dir_all", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason" },
  { path = "std::fs::DirBuilder::create", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason" },
  { path = "std::fs::remove_dir", reason = "deleting recordings goes through the durable-write layer; anything else needs #[expect] with a reason" },
  { path = "std::fs::remove_dir_all", reason = "deleting recordings goes through the durable-write layer; anything else needs #[expect] with a reason" },
  { path = "std::fs::hard_link", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason" },
  { path = "std::fs::set_permissions", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason" },
  { path = "std::os::unix::fs::symlink", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason", allow-invalid = true },
  { path = "std::fs::File::set_permissions", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason" },
