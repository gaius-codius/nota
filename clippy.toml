allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true

# nota-specific bans. Where a ban has one legitimate home (the clock module, the
# durable-write layer), that code uses #[expect(clippy::disallowed_methods,
# reason = "...")], so every exception is visible and greppable.
disallowed-methods = [
  { path = "std::time::Instant::now", reason = "read time through the session clock in nota-core, so timing code can be tested with a fake clock" },
  { path = "std::time::SystemTime::now", reason = "read time through the session clock in nota-core, so timing code can be tested with a fake clock" },
  # `elapsed` reads the clock too: `UNIX_EPOCH.elapsed()` is `SystemTime::now` by another name.
  { path = "std::time::Instant::elapsed", reason = "read time through the session clock in nota-core, so timing code can be tested with a fake clock" },
  { path = "std::time::SystemTime::elapsed", reason = "read time through the session clock in nota-core, so timing code can be tested with a fake clock" },
  { path = "rustix::time::clock_gettime", reason = "read time through the session clock in nota-core, so timing code can be tested with a fake clock", allow-invalid = true },
  { path = "rustix::time::clock_gettime_dynamic", reason = "read time through the session clock in nota-core, so timing code can be tested with a fake clock", allow-invalid = true },
  # jiff reads the calendar's time too; nota reads it only through nota-core's `wall_now`.
  { path = "jiff::Timestamp::now", reason = "read the calendar's time through wall_now in nota-core's clock module", allow-invalid = true },
  { path = "jiff::Zoned::now", reason = "read the calendar's time through wall_now in nota-core's clock module", allow-invalid = true },
  { path = "std::thread::sleep", reason = "sleeping hides races and makes tests slow and flaky; wait on a channel or the clock instead" },
  # rustix's sleeps (its `thread` feature, off in the tree today).
  { path = "rustix::thread::nanosleep", reason = "sleeping hides races and makes tests slow and flaky; wait on a channel or the clock instead", allow-invalid = true },
  { path = "rustix::thread::clock_nanosleep_relative", reason = "sleeping hides races and makes tests slow and flaky; wait on a channel or the clock instead", allow-invalid = true },
  { path = "rustix::thread::clock_nanosleep_absolute", reason = "sleeping hides races and makes tests slow and flaky; wait on a channel or the clock instead", allow-invalid = true },
  { path = "std::process::exit", reason = "exiting skips destructors and can leave a segment unfinished; return an error from main" },
  { path = "std::fs::write", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason" },
  { path = "std::fs::File::create", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason" },
  # The rest of the write path: opening for writing, directories, renaming,
  # removing, linking, permissions, fsyncing.
  # `nota_recorder::fs::StdFs` is the one home for these.
  { path = "std::fs::File::create_new", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason" },
  { path = "std::fs::OpenOptions::open", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason" },
  { path = "std::fs::rename", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason" },
  { path = "std::fs::remove_file", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason" },
  { path = "std::fs::copy", reason = "recordings and the database go through the durable-write layer; anything else needs #[expect] with a reason" },
