# Run by rust-ci's test job (pre-test-action in ci.yml), after the build
# dependencies are installed and before the tests.
name: nota pre-test
description: >
  The engine tests' models and speech fixture, and NOTA_REQUIRE_TEST_MODELS
  for the steps after it.
runs:
  using: composite
  steps:
    # The script checks every model file against its pinned SHA-256 on each
    # run, cached or not, and fails on a mismatch. The fixture is generated
    # (text-to-speech from pinned inputs, then ffmpeg) only when the cache
    # misses.
    - name: Restore the test models
      id: test-models
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.local/share/nota/test-models/parakeet-tdt-0.6b-v3-int8
          ~/.local/share/nota/test-models/silero_vad_v6.onnx
          ~/.local/share/nota/test-models/fixtures
        key: test-models-${{ hashFiles('scripts/fetch-test-models.sh', 'crates/nota-engine/tests/fixtures/invented-lecture.txt') }}
    # After install-linux-build-deps.sh, which updates the package lists.
    - name: Install ffmpeg for the fixture
      if: steps.test-models.outputs.cache-hit != 'true'
      shell: bash
      run: sudo apt-get install -y -qq --no-install-recommends ffmpeg
    - name: Fetch and check the test models
      shell: bash
      run: scripts/fetch-test-models.sh
    # With the variable set, an engine test whose models are missing fails
    # instead of skipping.
    - name: Require the test models
      shell: bash
      run: echo "NOTA_REQUIRE_TEST_MODELS=1" >>"$GITHUB_ENV"
