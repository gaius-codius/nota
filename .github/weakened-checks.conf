# nota's config: the check config its scripts/check-weakened.sh listed. Copy
# to .github/weakened-checks.conf. The rules are the detector's defaults.
config-path rust-toolchain.toml rustfmt.toml clippy.toml clippy-crates.txt typos.toml deny.toml
