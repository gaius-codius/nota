# nota's config: the check config its scripts/check-weakened.sh listed, the
# detector's built-in list (@defaults: CODEOWNERS, .github/actions, gitleaks
# config and the rest), and build scripts and .gitattributes, which that list
# leaves out. The rules are the detector's defaults.
config-path @defaults :(glob)**/build.rs :(glob)**/.gitattributes
config-path rust-toolchain.toml rustfmt.toml clippy.toml clippy-crates.txt typos.toml deny.toml
config-path .config/nextest.toml .cargo/config.toml .cargo/mutants.toml lefthook.yml
config-path .github/workflows scripts/check-* scripts/*.test.sh scripts/lazyfs-crash.sh
