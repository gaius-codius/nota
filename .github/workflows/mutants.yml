# Weekly mutation testing of the whole core and recorder crates. Each PR
# tests only the mutants of its own changes (ci.yml); this catches tests that
# have weakened since, and code a PR's diff didn't reach.
name: Mutation testing

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutation testing (shard ${{ matrix.shard }} of 8)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cargo-mutants builds in its own copy of the tree, so a cached
          # target directory would go unused.
          cache-targets: false
      - run: scripts/install-linux-build-deps.sh
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - env:
          SHARD: ${{ matrix.shard }}
          # Each test process gets at most 1 GiB of address space. A mutant
          # that makes a test grow without end (one that keeps the engine's
          # reader thread queueing after its output ends, say) would
          # otherwise fill the runner's memory and shut it down, losing the
          # shard's report; capped, the test fails and the mutant counts as
          # caught. Two jobs of four tests each stay under the runner's
          # 16 GB at the cap, and the tests pass under half of it.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --as=1073741824 --
        run: >-
          cargo mutants -p nota-core -p nota-recorder
          --shard "$SHARD/8"
          --test-tool nextest --jobs 2 --output "$RUNNER_TEMP"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants.out

  report-failure:
    # A red run opens an issue labelled mutants-weekly, or comments on the
    # open one, so it doesn't go unseen: GitHub emails a scheduled run's
    # failure only to whoever last changed this file. A green run skips this
    # job, and so does a cancelled one. A shard that times out counts as
    # failed.
    name: Report a failed run
    needs: mutants
    if: >-
      !cancelled() && needs.mutants.result != 'success'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # to open or comment on the failure issue and its label
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          gh label create mutants-weekly --force --color B60205 \
            --description "A weekly mutation testing run failed"
          body="[Mutation testing run]($RUN_URL) on \`$REF\` failed. Each shard's
          missed and timed-out mutants are in its mutants-shard-N artifact
          (missed.txt, timeout.txt); a shard that stopped without one lists them
          in its log."
          open=$(gh issue list --label mutants-weekly --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Weekly mutation testing failed" \
              --label mutants-weekly --body "$body"
          fi
