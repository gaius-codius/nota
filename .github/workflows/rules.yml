# Repo rules that aren't about the code itself: no recordings or large files,
# and no silent weakening of checks. Separate from CI so editing a PR's body
# re-runs only this. Both jobs are about a pull request, so nothing runs on a
# push to main. The secrets scan is the shared "rust / secrets" job in ci.yml.
# Editing a closed PR's text runs nothing: its branch may be gone, and nothing
# on it needs checking any more.
name: Repo rules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  files:
    name: No recordings or large files
    if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-files.sh "$PR_BASE" "$PR_HEAD"

  weakened:
    name: Weakened checks are explained
    if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gaius-codius/weakened-checks@cc325ccc488212c9abbc453557266ba42c0177f8 # v2.1.0
