name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  lint:
    name: fmt, clippy, typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/install-linux-build-deps.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rust-cache keeps sherpa-onnx-sys's build-script output but deletes the
      # files it downloaded into target/sherpa-onnx-prebuilt, leaving empty
      # directories. Remove both, so the build script runs and downloads again.
      - name: Rerun the sherpa-onnx-sys build script
        shell: bash
        run: |
          if [ -d target ]; then
            find target \( -path '*/.fingerprint/sherpa-onnx-sys-*' -o -name sherpa-onnx-prebuilt \) \
              -prune -exec rm -rf {} +
          fi
      - run: scripts/install-linux-build-deps.sh
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --profile ci --no-tests=fail
      # nextest does not run doctests.
      - run: cargo test --workspace --locked --doc

  deps:
    name: Dependencies (cargo-deny, cargo-shear)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-shear
      - run: cargo shear

  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false

  no-gpl:
    # A nota for distribution links sherpa-onnx without text-to-speech, so no
    # GPL code (espeak-ng, ucd-tools) ships in it. Builds the release binary
    # that way and checks its symbols.
    name: No GPL in the release binary (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/check-no-gpl.test.sh
      - run: |
          lib=$(scripts/sherpa-onnx-no-tts.sh "$RUNNER_TEMP/sherpa-onnx")
          SHERPA_ONNX_LIB_DIR=$lib cargo build --release -p nota --locked
      - run: scripts/check-no-gpl.sh target/release/nota

  mutants:
    # Every mutant of the lines this PR changes in the core and recorder
    # crates must be caught by a test. A missed or timed-out mutant fails.
    # The weekly full run is in mutants.yml.
    name: Mutation testing (changed code)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/install-linux-build-deps.sh
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - name: Diff against the base branch
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff "$PR_BASE...HEAD" > "$RUNNER_TEMP/pr.diff"
      - run: >-
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff"
          -p nota-core -p nota-recorder
          --test-tool nextest --jobs 2 --output "$RUNNER_TEMP"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants
          path: ${{ runner.temp }}/mutants.out

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows only build for now, so platform breakage shows up
        # early. They record nothing until v2 and v3.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rust-cache keeps sherpa-onnx-sys's build-script output but deletes the
      # files it downloaded into target/sherpa-onnx-prebuilt, leaving empty
      # directories. Remove both, so the build script runs and downloads again.
      - name: Rerun the sherpa-onnx-sys build script
        shell: bash
        run: |
          if [ -d target ]; then
            find target \( -path '*/.fingerprint/sherpa-onnx-sys-*' -o -name sherpa-onnx-prebuilt \) \
              -prune -exec rm -rf {} +
          fi
      - run: cargo build --workspace --all-targets --locked

  coverage:
    name: Coverage (report only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rust-cache keeps sherpa-onnx-sys's build-script output but deletes the
      # files it downloaded into target/sherpa-onnx-prebuilt, leaving empty
      # directories. Remove both, so the build script runs and downloads again.
      - name: Rerun the sherpa-onnx-sys build script
        shell: bash
        run: |
          if [ -d target ]; then
            find target \( -path '*/.fingerprint/sherpa-onnx-sys-*' -o -name sherpa-onnx-prebuilt \) \
              -prune -exec rm -rf {} +
          fi
      - run: scripts/install-linux-build-deps.sh
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --locked --no-tests=fail --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: lcov.info
