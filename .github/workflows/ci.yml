name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  rust:
    # The shared lint, test, deps and workflow-lint jobs, from rust-ci; their
    # checks are "rust / lint", "rust / test", "rust / deps" and
    # "rust / workflows". nota's own steps go in through the inputs.
    uses: gaius-codius/rust-ci/.github/workflows/rust.yml@04229b0c6e3fbc7440dcce3dcdb56d6c5308b5a6 # v1.0.0
    with:
      # The native build dependencies (after which the package lists are
      # fresh), and the sherpa-onnx libraries from the archive pinned by
      # SHA-256: every build links these (.cargo/config.toml), never an
      # unchecked download.
      setup-scripts: |
        scripts/install-linux-build-deps.sh
        scripts/sherpa-onnx.sh
      # sherpa-onnx-sys's cached build bundles the pinned libraries. A new pin
      # renames their directory, so cargo rebuilds it anyway; a new cache with
      # each pin keeps old builds from piling up.
      cache-key-files: scripts/sherpa-onnx.sh
      # The engine tests' models and speech fixture, and
      # NOTA_REQUIRE_TEST_MODELS: .github/actions/pre-test.
      pre-test-action: true
      # --all-targets: examples' unit tests too, run by the test harness, so
      # no example's main runs.
      test-command: cargo nextest run --workspace --all-targets --locked --profile ci --no-tests=fail
      # Every workspace target was in the run above (cargo skips one whose
      # required-features are off without a word); the arguments must match.
      post-test-script: scripts/check-test-targets.sh
      # Broken doc links and stray HTML in doc comments. All features, so the
      # test fakes behind `fake-fs`, `fake-clock` and the rest are checked too.
      doc-all-features: true

  scripts:
    # The scripts' own tests, and the clippy-bans check. None of them builds
    # Rust.
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/sherpa-onnx.test.sh
      - run: scripts/check-weakened.test.sh
      - run: scripts/check-files.test.sh
      - run: scripts/check-clippy-bans.test.sh
      - run: scripts/check-test-targets.test.sh
      # The soak analyser's lag check; the soak itself is run by hand.
      - run: scripts/soak-analyse.test.sh
      # The crash runner's prerequisites, fault accounting and clean-up,
      # against stand-ins for LazyFS and the recorder; the real sweep is run
      # by hand (see the script).
      - run: scripts/lazyfs-crash.test.sh
      # Every crate in the lock files is classified in clippy-crates.txt, and
      # what it bans is in clippy.toml.
      - run: scripts/check-clippy-bans.sh

  no-gpl:
    # A nota for distribution links sherpa-onnx without text-to-speech, so no
    # GPL code (espeak-ng, ucd-tools) ships in it. Builds the release binary
    # that way and checks its symbols.
    name: No GPL in the release binary (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # See the rust job.
          key: sherpa-onnx-${{ hashFiles('scripts/sherpa-onnx.sh') }}
      - run: scripts/check-no-gpl.test.sh
      # nota links the recorder, whose capture needs PipeWire's and ALSA's
      # headers to build.
      - run: scripts/install-linux-build-deps.sh
      - run: |
          lib=$(scripts/sherpa-onnx.sh --no-tts "$RUNNER_TEMP/sherpa-onnx")
          SHERPA_ONNX_LIB_DIR=$lib cargo build --release -p nota --locked
      - run: scripts/check-no-gpl.sh target/release/nota

  fuzz:
    # fuzz/ is its own workspace, outside the normal build and tests; this
    # keeps its targets compiling and linted. It builds them and doesn't
    # fuzz.
    name: Fuzz targets build
    runs-on: ubuntu-latest
    env:
      # cargo-afl builds with -C target-cpu=native, and without --target that
      # covers build scripts and proc macros too, which run during the build.
      # A cached target/ built on a runner with a newer CPU then dies with
      # SIGILL on an older one. cargo-afl appends RUSTFLAGS after its own
      # flags and rustc takes the last target-cpu, so this pins everything
      # rustc builds to the baseline x86-64 CPU that every runner has. (The
      # AFL++ runtime is C, built with -march=native when the compiler takes
      # it; it isn't cached, but rebuilt each run on the runner that uses
      # it.) It's job-level so rust-cache hashes it into the cache key.
      RUSTFLAGS: -C target-cpu=x86-64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Which CPU this runner has, for when a build fails on one CPU only.
      - run: grep -m1 'model name' /proc/cpuinfo
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - run: scripts/install-linux-build-deps.sh
      # Must match the afl crate in fuzz/Cargo.lock. Installing builds the
      # AFL++ runtime from cargo-afl's sources; --force reinstalls even when
      # rust-cache restored the binary (but not the sources or the runtime).
      - run: cargo install cargo-afl --version 0.18.2 --locked --force
      - run: cargo afl build --locked
        working-directory: fuzz
      # fuzz/ copies the workspace's lint table (it can't inherit it), and
      # the job denies warnings, so the targets meet the same lints.
      - run: cargo clippy --all-targets --locked
        working-directory: fuzz

  mutants-shard:
    # Every mutant of the lines this PR changes in the core and recorder
    # crates must be caught by a test. A missed or timed-out mutant fails.
    # The mutants are dealt out round-robin to five shards that run side by
    # side; the job below gathers the results. Round-robin, not cargo-mutants'
    # default consecutive slices: a file's mutants tend to share slow tests,
    # and slices put them on one shard. On one 88-mutant diff the slowest
    # shard took 16 minutes as slices and 9 dealt round-robin.
    # The weekly full run is in mutants.yml.
    name: Mutation testing (shard ${{ strategy.job-index }} of ${{ strategy.job-total }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One shard failing doesn't stop the others, so a run reports every
      # missed mutant at once.
      fail-fast: false
      # One leg per shard. The shard number is the leg's index, so it can't
      # disagree with the count if the matrix grows another axis.
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      # Warnings stay warnings here: a mutant that leaves a parameter unused
      # would otherwise fail to build and count as unviable, not tested.
      # Lint and test still deny them.
      CARGO_BUILD_WARNINGS: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cargo-mutants builds in its own copy of the tree, so a cached
          # target directory would go unused.
          cache-targets: false
      - run: scripts/install-linux-build-deps.sh
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - name: Diff against the base branch
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff --src-prefix=a/ --dst-prefix=b/ "$PR_BASE...HEAD" > "$RUNNER_TEMP/pr.diff"
      # A shard dealt no mutants (a small diff, or none in these crates) passes.
      - env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        run: >-
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff"
          -p nota-core -p nota-recorder
          --shard "$SHARD/$SHARDS" --sharding round-robin
          --test-tool nextest --jobs 2 --output "$RUNNER_TEMP"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/mutants.out

  mutants:
    # The required check. It passes only if every shard passed: a failed,
    # cancelled or skipped shard fails it, and it runs even then (always()),
    # so it can't be skipped, which a ruleset would count as passing. A run
    # cancelled by a newer push therefore fails here too; that commit is
    # superseded.
    name: Mutation testing (changed code)
    if: always() && github.event_name == 'pull_request'
    needs: mutants-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHARDS_RESULT: ${{ needs.mutants-shard.result }}
        run: |
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error::Mutation testing shards: $SHARDS_RESULT (every shard must pass)"
            exit 1
          fi
          echo "Every mutation testing shard passed."

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows only build for now, so platform breakage shows up
        # early. They record nothing until v2 and v3.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # See the rust job.
          key: sherpa-onnx-${{ hashFiles('scripts/sherpa-onnx.sh') }}
      # The sherpa-onnx libraries, from the archive pinned by SHA-256; every
      # build links these (.cargo/config.toml), never an unchecked download.
      - name: Fetch the pinned sherpa-onnx libraries
        shell: bash
        run: scripts/sherpa-onnx.sh
      - run: cargo build --workspace --all-targets --locked

  coverage-scope:
    # Coverage runs on every push to main, and on a pull request only when
    # it changes how coverage runs, so a broken coverage command fails
    # before it merges rather than on main.
    name: Coverage scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's checkout is its merge into the base branch, so
          # the first parent is the base.
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        shell: bash
        run: |
          if git diff --quiet HEAD^1 HEAD -- .github/workflows/ci.yml .config/nextest.toml .cargo/config.toml rust-toolchain.toml; then
            echo changed=false >>"$GITHUB_OUTPUT"
          else
            echo changed=true >>"$GITHUB_OUTPUT"
          fi

  coverage:
    name: Coverage (report only)
    needs: coverage-scope
    # The scope job is skipped on push, so this states its own condition.
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || needs.coverage-scope.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # See the rust job.
          key: sherpa-onnx-${{ hashFiles('scripts/sherpa-onnx.sh') }}
      # The sherpa-onnx libraries, from the archive pinned by SHA-256; every
      # build links these (.cargo/config.toml), never an unchecked download.
      - name: Fetch the pinned sherpa-onnx libraries
        shell: bash
        run: scripts/sherpa-onnx.sh
      - run: scripts/install-linux-build-deps.sh
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # llvm-profdata's default refuses to merge any profile when one is
      # unreadable. Main once failed that way after every test passed, and a
      # rerun of the same commit passed: most likely a process killed while
      # writing its profile at exit (the tests kill engines and re-run test
      # binaries as children), though it hasn't been reproduced.
      # --failure-mode all skips an unreadable profile and still fails when
      # none merges. Each profile warning is raised as an annotation, and
      # more than three fail the job: one binary's profiles unreadable on
      # every run would otherwise drop its coverage quietly.
      - name: Run the tests with coverage
        shell: bash
        run: |
          cargo llvm-cov nextest --workspace --all-targets --locked --no-tests=fail --failure-mode all --lcov --output-path lcov.info 2>&1 | tee "$RUNNER_TEMP/coverage.log"
          warned=$(grep -cE '^warning: .*\.profraw: ' "$RUNNER_TEMP/coverage.log" || true)
          grep -E '^warning: .*\.profraw: ' "$RUNNER_TEMP/coverage.log" | sed 's/^warning: /::warning title=Coverage profile warning::/' || true
          echo "Coverage profiles with warnings (skipped if unreadable): $warned" >>"$GITHUB_STEP_SUMMARY"
          if [ "$warned" -gt 3 ]; then
            echo "::error::$warned coverage profiles had warnings; more than 3 means a systematic loss, not a one-off"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: lcov.info
