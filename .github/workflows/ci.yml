name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  lint:
    name: fmt, clippy, typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # sherpa-onnx-sys's cached build bundles the pinned libraries, and
          # cargo doesn't notice a new pin; a new pin needs a new cache.
          key: sherpa-onnx-${{ hashFiles('scripts/sherpa-onnx.sh') }}
      - run: scripts/install-linux-build-deps.sh
      - run: scripts/sherpa-onnx.test.sh
      # The sherpa-onnx libraries, from the archive pinned by SHA-256; every
      # build links these (.cargo/config.toml), never an unchecked download.
      - name: Fetch the pinned sherpa-onnx libraries
        shell: bash
        run: scripts/sherpa-onnx.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # See the lint job.
          key: sherpa-onnx-${{ hashFiles('scripts/sherpa-onnx.sh') }}
      # The sherpa-onnx libraries, from the archive pinned by SHA-256; every
      # build links these (.cargo/config.toml), never an unchecked download.
      - name: Fetch the pinned sherpa-onnx libraries
        shell: bash
        run: scripts/sherpa-onnx.sh
      - run: scripts/install-linux-build-deps.sh
      # The engine tests' models and speech fixture. The script checks every
      # model file against its pinned SHA-256 on each run, cached or not, and
      # fails on a mismatch. The fixture is generated (text-to-speech from
      # pinned inputs, then ffmpeg) only when the cache misses.
      - name: Restore the test models
        id: test-models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/nota/test-models/parakeet-tdt-0.6b-v3-int8
            ~/.local/share/nota/test-models/silero_vad_v6.onnx
            ~/.local/share/nota/test-models/fixtures
          key: test-models-${{ hashFiles('scripts/fetch-test-models.sh', 'crates/nota-engine/tests/fixtures/invented-lecture.txt') }}
      # After install-linux-build-deps.sh, which updates the package lists.
      - name: Install ffmpeg for the fixture
        if: steps.test-models.outputs.cache-hit != 'true'
        run: sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: scripts/fetch-test-models.sh
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      # With the variable set, an engine test whose models are missing fails
      # instead of skipping.
      - run: cargo nextest run --workspace --locked --profile ci --no-tests=fail
        env:
          NOTA_REQUIRE_TEST_MODELS: "1"
      # nextest does not run doctests.
      - run: cargo test --workspace --locked --doc

  deps:
    name: Dependencies (cargo-deny, cargo-shear)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-shear
      - run: cargo shear

  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false

  no-gpl:
    # A nota for distribution links sherpa-onnx without text-to-speech, so no
    # GPL code (espeak-ng, ucd-tools) ships in it. Builds the release binary
    # that way and checks its symbols.
    name: No GPL in the release binary (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # See the lint job.
          key: sherpa-onnx-${{ hashFiles('scripts/sherpa-onnx.sh') }}
      - run: scripts/check-no-gpl.test.sh
      - run: |
          lib=$(scripts/sherpa-onnx.sh --no-tts "$RUNNER_TEMP/sherpa-onnx")
          SHERPA_ONNX_LIB_DIR=$lib cargo build --release -p nota --locked
      - run: scripts/check-no-gpl.sh target/release/nota

  fuzz:
    # fuzz/ is its own workspace, outside the normal build and tests; this
    # keeps its targets compiling. It builds them and doesn't fuzz.
    name: Fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - run: scripts/install-linux-build-deps.sh
      # Must match the afl crate in fuzz/Cargo.lock. Installing builds the
      # AFL++ runtime from cargo-afl's sources; --force reinstalls even when
      # rust-cache restored the binary (but not the sources or the runtime).
      - run: cargo install cargo-afl --version 0.18.2 --locked --force
      - run: cargo afl build --locked
        working-directory: fuzz

  mutants-shard:
    # Every mutant of the lines this PR changes in the core and recorder
    # crates must be caught by a test. A missed or timed-out mutant fails.
    # The mutants are split into consecutive slices, a quarter of them per
    # shard, run side by side; the job below gathers the results.
    # The weekly full run is in mutants.yml.
    name: Mutation testing (shard ${{ strategy.job-index }} of ${{ strategy.job-total }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One shard failing doesn't stop the others, so a run reports every
      # missed mutant at once.
      fail-fast: false
      # One leg per shard. The shard number is the leg's index, so it can't
      # disagree with the count if the matrix grows another axis.
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # Warnings stay warnings here: a mutant that leaves a parameter unused
      # would otherwise fail to build and count as unviable, not tested.
      # Lint and test still deny them.
      CARGO_BUILD_WARNINGS: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cargo-mutants builds in its own copy of the tree, so a cached
          # target directory would go unused.
          cache-targets: false
      - run: scripts/install-linux-build-deps.sh
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - name: Diff against the base branch
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff --src-prefix=a/ --dst-prefix=b/ c3b540455206681f3c8f54181010f8455829245f^ c3b540455206681f3c8f54181010f8455829245f > "$RUNNER_TEMP/pr.diff" && git checkout -q c3b540455206681f3c8f54181010f8455829245f # TEMPORARY measurement
      # A shard whose slice is empty finds no mutants and passes.
      - env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        run: >-
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff"
          -p nota-core -p nota-recorder
          --shard "$SHARD/$SHARDS"
          --sharding round-robin --test-tool nextest --jobs 2 --output "$RUNNER_TEMP"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/mutants.out

  mutants-shard-rr5:
    # Every mutant of the lines this PR changes in the core and recorder
    # crates must be caught by a test. A missed or timed-out mutant fails.
    # The mutants are split into consecutive slices, a quarter of them per
    # shard, run side by side; the job below gathers the results.
    # The weekly full run is in mutants.yml.
    name: TEMP rr5 Mutation testing (shard ${{ strategy.job-index }} of ${{ strategy.job-total }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One shard failing doesn't stop the others, so a run reports every
      # missed mutant at once.
      fail-fast: false
      # One leg per shard. The shard number is the leg's index, so it can't
      # disagree with the count if the matrix grows another axis.
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      # Warnings stay warnings here: a mutant that leaves a parameter unused
      # would otherwise fail to build and count as unviable, not tested.
      # Lint and test still deny them.
      CARGO_BUILD_WARNINGS: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cargo-mutants builds in its own copy of the tree, so a cached
          # target directory would go unused.
          cache-targets: false
      - run: scripts/install-linux-build-deps.sh
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - name: Diff against the base branch
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff --src-prefix=a/ --dst-prefix=b/ c3b540455206681f3c8f54181010f8455829245f^ c3b540455206681f3c8f54181010f8455829245f > "$RUNNER_TEMP/pr.diff" && git checkout -q c3b540455206681f3c8f54181010f8455829245f # TEMPORARY measurement
      # A shard whose slice is empty finds no mutants and passes.
      - env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        run: >-
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff"
          -p nota-core -p nota-recorder
          --shard "$SHARD/$SHARDS"
          --sharding round-robin --test-tool nextest --jobs 2 --output "$RUNNER_TEMP"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rr5-mutants-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/mutants.out

  mutants-shard-rr4skip:
    # Every mutant of the lines this PR changes in the core and recorder
    # crates must be caught by a test. A missed or timed-out mutant fails.
    # The mutants are split into consecutive slices, a quarter of them per
    # shard, run side by side; the job below gathers the results.
    # The weekly full run is in mutants.yml.
    name: TEMP rr4 skip Mutation testing (shard ${{ strategy.job-index }} of ${{ strategy.job-total }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One shard failing doesn't stop the others, so a run reports every
      # missed mutant at once.
      fail-fast: false
      # One leg per shard. The shard number is the leg's index, so it can't
      # disagree with the count if the matrix grows another axis.
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # Warnings stay warnings here: a mutant that leaves a parameter unused
      # would otherwise fail to build and count as unviable, not tested.
      # Lint and test still deny them.
      CARGO_BUILD_WARNINGS: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cargo-mutants builds in its own copy of the tree, so a cached
          # target directory would go unused.
          cache-targets: false
      - run: scripts/install-linux-build-deps.sh
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - name: Diff against the base branch
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff --src-prefix=a/ --dst-prefix=b/ c3b540455206681f3c8f54181010f8455829245f^ c3b540455206681f3c8f54181010f8455829245f > "$RUNNER_TEMP/pr.diff" && git checkout -q c3b540455206681f3c8f54181010f8455829245f # TEMPORARY measurement
      # A shard whose slice is empty finds no mutants and passes.
      - env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        run: >-
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff"
          -p nota-core -p nota-recorder
          --shard "$SHARD/$SHARDS"
          --sharding round-robin --baseline skip --timeout 225 --test-tool nextest --jobs 2 --output "$RUNNER_TEMP"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rr4skip-mutants-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/mutants.out

  rerun-probe:
    name: TEMP probe leg ${{ strategy.job-index }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [0, 1]
    steps:
      - run: '[ "$GITHUB_RUN_ATTEMPT" -gt 1 ]'

  rerun-probe-gate:
    name: TEMP probe gate
    if: always()
    needs: rerun-probe
    runs-on: ubuntu-latest
    steps:
      - env:
          R: ${{ needs.rerun-probe.result }}
        run: |
          echo "result: $R"
          [ "$R" = success ]

  mutants:
    # The required check. It passes only if every shard passed: a failed,
    # cancelled or skipped shard fails it, and it runs even then (always()),
    # so it can't be skipped, which a ruleset would count as passing. A run
    # cancelled by a newer push therefore fails here too; that commit is
    # superseded.
    name: Mutation testing (changed code)
    if: always() && github.event_name == 'pull_request'
    needs: mutants-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHARDS_RESULT: ${{ needs.mutants-shard.result }}
        run: |
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error::Mutation testing shards: $SHARDS_RESULT (every shard must pass)"
            exit 1
          fi
          echo "Every mutation testing shard passed."

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows only build for now, so platform breakage shows up
        # early. They record nothing until v2 and v3.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # See the lint job.
          key: sherpa-onnx-${{ hashFiles('scripts/sherpa-onnx.sh') }}
      # The sherpa-onnx libraries, from the archive pinned by SHA-256; every
      # build links these (.cargo/config.toml), never an unchecked download.
      - name: Fetch the pinned sherpa-onnx libraries
        shell: bash
        run: scripts/sherpa-onnx.sh
      - run: cargo build --workspace --all-targets --locked

  coverage:
    name: Coverage (report only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # See the lint job.
          key: sherpa-onnx-${{ hashFiles('scripts/sherpa-onnx.sh') }}
      # The sherpa-onnx libraries, from the archive pinned by SHA-256; every
      # build links these (.cargo/config.toml), never an unchecked download.
      - name: Fetch the pinned sherpa-onnx libraries
        shell: bash
        run: scripts/sherpa-onnx.sh
      - run: scripts/install-linux-build-deps.sh
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --locked --no-tests=fail --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: lcov.info
