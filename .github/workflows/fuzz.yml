# A short AFL++ run of each fuzz target, weekly. Per-PR CI only builds the
# targets (ci.yml); this gives them a few minutes of real fuzzing so a
# regression in the reader or the protocol parser turns up without anyone
# running them by hand. Not a required check. A crash fails the run and is
# uploaded as an artifact; see fuzz/README.md for turning it into a test.
name: Fuzz

on:
  schedule:
    - cron: "43 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Baseline x86-64 for everything rustc builds, as in ci.yml's fuzz job.
  RUSTFLAGS: -C target-cpu=x86-64

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [journal_reader, engine_protocol]
    env:
      # Seconds of fuzzing per target.
      FUZZ_SECONDS: "300"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - run: scripts/install-linux-build-deps.sh
      # Must match the afl crate in fuzz/Cargo.lock (see ci.yml).
      - run: cargo install cargo-afl --version 0.18.2 --locked --force
      - name: Build the targets and their seeds
        working-directory: fuzz
        run: |
          cargo run --locked --bin make_seeds
          mkdir -p in-protocol
          printf '\x07\x00\x00\x00\x00nota\x01\x00' > in-protocol/hello
          cargo afl build --locked --release
      - name: Fuzz
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
          AFL_SKIP_CPUFREQ: "1"
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
          AFL_NO_UI: "1"
        run: |
          seeds=in
          if [ "$TARGET" = engine_protocol ]; then seeds=in-protocol; fi
          cargo afl fuzz -V "$FUZZ_SECONDS" -i "$seeds" -o "out-$TARGET" "target/release/$TARGET"
      - name: Fail on crashes
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          crashes=$(find "out-$TARGET" -path '*/crashes/*' -type f ! -name README.txt | wc -l)
          echo "Crashes found: $crashes" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$crashes" -eq 0 ]
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/out-${{ matrix.target }}

  report-failure:
    # A red run opens an issue labelled fuzz-weekly, or comments on the open
    # one, as mutants.yml does: GitHub emails a scheduled run's failure only to
    # whoever last changed this file. A green or cancelled run skips this job.
    name: Report a failed run
    needs: fuzz
    if: >-
      !cancelled() && needs.fuzz.result != 'success'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # to open or comment on the failure issue and its label
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          gh label create fuzz-weekly --force --color B60205 \
            --description "A weekly fuzz run failed"
          body="[Fuzz run]($RUN_URL) on \`$REF\` failed. A target's crashes are in
          its fuzz-crashes-TARGET artifact; fuzz/README.md says how to turn one
          into a test."
          open=$(gh issue list --label fuzz-weekly --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Weekly fuzz run failed" \
              --label fuzz-weekly --body "$body"
          fi
